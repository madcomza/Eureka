<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <!-- Gradients for faceted EUREKA letters -->
    <linearGradient id="blueGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f2b69" />
    </linearGradient>
    <linearGradient id="blueGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="blueGrad3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="starRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="starCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <g transform="skewX(-10)">
    <!-- EUREKA Main Text with Faceted Aesthetic -->
    <!-- E -->
    <g transform="translate(85, 185)">
      <!-- Main E -->
      <path d="M 0,-140 L 75,-140 L 75,-102 L 34,-102 L 34,-82 L 68,-82 L 68,-48 L 34,-48 L 34,-26 L 78,-26 L 78,12 L 0,12 Z" fill="#1e40af" />
      <polygon points="0,-140 75,-140 40,-102 0,-102" fill="#3b82f6" opacity="0.8" />
      <polygon points="0,-60 34,-48 34,-26 0,12" fill="#0f2b69" />
      <polygon points="0,12 78,12 40,-26 0,-26" fill="#172554" opacity="0.9" />
    </g>

    <!-- U -->
    <g transform="translate(185, 185)">
      <path d="M 0,-140 L 34,-140 L 34,-50 Q 34,-20 48,-20 Q 62,-20 62,-50 L 62,-140 L 96,-140 L 96,-48 Q 96,15 48,15 Q 0,15 0,-48 Z" fill="#1d4ed8" />
      <polygon points="0,-140 34,-140 34,-70 0,-40" fill="#2563eb" opacity="0.85" />
      <polygon points="0,-48 0,15 48,15 34,-20" fill="#0f2b69" />
      <polygon points="62,-140 96,-140 96,-70 62,-40" fill="#1e3a8a" />
      <polygon points="62,-50 96,-48 96,15 48,15" fill="#172554" />
    </g>

    <!-- R -->
    <g transform="translate(305, 185)">
      <path d="M 0,-140 L 65,-140 Q 98,-140 98,-100 Q 98,-72 75,-62 L 102,12 L 64,12 L 40,-58 L 34,-58 L 34,12 L 0,12 Z M 34,-108 L 34,-88 L 60,-88 Q 68,-88 68,-98 Q 68,-108 60,-108 Z" fill="#1e40af" />
      <polygon points="0,-140 65,-140 60,-88 0,-108" fill="#3b82f6" opacity="0.8" />
      <polygon points="40,-58 102,12 64,12 34,-30" fill="#0f2b69" />
      <polygon points="0,-58 34,-58 34,12 0,12" fill="#172554" />
    </g>

    <!-- E -->
    <g transform="translate(425, 185)">
      <path d="M 0,-140 L 75,-140 L 75,-102 L 34,-102 L 34,-82 L 68,-82 L 68,-48 L 34,-48 L 34,-26 L 78,-26 L 78,12 L 0,12 Z" fill="#1d4ed8" />
      <polygon points="0,-140 75,-140 40,-102 0,-102" fill="#2563eb" opacity="0.8" />
      <polygon points="0,-60 34,-48 34,-26 0,12" fill="#0f2b69" />
      <polygon points="0,12 78,12 40,-26 0,-26" fill="#172554" />
    </g>

    <!-- K -->
    <g transform="translate(525, 185)">
      <path d="M 0,-140 L 34,-140 L 34,-76 L 72,-140 L 112,-140 L 58,-58 L 115,12 L 72,12 L 34,-42 L 34,12 L 0,12 Z" fill="#1e40af" />
      <polygon points="0,-140 34,-140 34,12 0,12" fill="#172554" />
      <polygon points="34,-76 72,-140 112,-140 58,-58" fill="#3b82f6" opacity="0.8" />
      <polygon points="58,-58 115,12 72,12 34,-42" fill="#0f2b69" />
    </g>

    <!-- A -->
    <g transform="translate(650, 185)">
      <path d="M 0,12 L 48,-140 L 86,-140 L 134,12 L 96,12 L 85,-26 L 46,-26 L 36,12 Z M 55,-58 L 76,-58 L 65,-102 Z" fill="#1d4ed8" />
      <polygon points="0,12 48,-140 65,-140 46,-26" fill="#2563eb" opacity="0.85" />
      <polygon points="86,-140 134,12 96,12 85,-26" fill="#0f2b69" />
      <polygon points="46,-26 85,-26 96,12 36,12" fill="#172554" />
    </g>
  </g>

  <!-- Central Starburst Effect (Cyan and Red Star Over U-R-E) -->
  <g transform="translate(365, 115)">
    <!-- Cyan Starburst Spikes -->
    <g fill="url(#starCyanGrad)">
      <polygon points="0,0 28,-75 0,-15 -28,-75" />
      <polygon points="0,0 75,-28 15,0 75,28" />
      <polygon points="0,0 28,75 0,15 -28,75" />
      <polygon points="0,0 -75,28 -15,0 -75,-28" />
      <polygon points="0,0 120,-10 25,0 120,25" />
      <polygon points="0,0 45,95 10,25 25,95" />
      <polygon points="0,0 -85,65 -20,15 -65,85" />
      <polygon points="0,0 -35,-85 -5,-20 -55,-70" />
    </g>

    <!-- Red Primary Starburst Spikes (Overlapping with Sharp Dynamic Rays) -->
    <g fill="url(#starRedGrad)">
      <polygon points="0,0 -160,-22 -35,-5 -140,-5" />
      <polygon points="0,0 15,-105 0,-30 45,-95" />
      <polygon points="0,0 110,65 30,15 95,85" />
      <polygon points="0,0 -45,100 -12,25 -65,90" />
      <polygon points="0,0 -185,-20 -40,-2 -150,8" />
      <polygon points="0,0 20,-125 5,-35 40,-110" />
    </g>

    <!-- Center White/Glow Core -->
    <circle cx="0" cy="0" r="7" fill="#ffffff" />
    <circle cx="0" cy="0" r="3" fill="#38bdf8" />
  </g>

  <!-- Red Divider Line -->
  <rect x="50" y="200" width="900" height="7" fill="#d91b1b" rx="2" />

  <!-- Subtitle Line 1: FACILITIES MANAGEMENT (Red Bold Italic) -->
  <text x="500" y="262" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" 
        font-size="44" 
        font-weight="900" 
        font-style="italic" 
        letter-spacing="2.5" 
        text-anchor="middle" 
        fill="#d91b1b">
    FACILITIES MANAGEMENT
  </text>

  <!-- Blue Accent Underline & Subtitle Line 2: SOLUTIONS -->
  <line x1="50" y1="290" x2="550" y2="290" stroke="#0f3b82" stroke-width="5" stroke-linecap="round" />
  
  <text x="750" y="318" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" 
        font-size="44" 
        font-weight="900" 
        font-style="italic" 
        letter-spacing="2" 
        text-anchor="middle" 
        fill="#0f3b82">
    SOLUTIONS
  </text>
</svg>
